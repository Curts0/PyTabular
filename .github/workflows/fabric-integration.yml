name: Fabric integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    environment: fabric-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: ./tools/restore-runtime.ps1
        shell: pwsh
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest -m fabric
        env:
          PYTABULAR_TEST_CONNECTION_STRING: ${{ secrets.PYTABULAR_TEST_CONNECTION_STRING }}
