[tox]
env_list = py311, py312, py313, py314, lint, type, docs

[testenv]
description = run the offline test suite
extras = dev
commands = pytest

[testenv:lint]
base_python = py311
skip_install = true
deps = ruff
commands =
    ruff check pytabular tests
    ruff format --check pytabular tests

[testenv:type]
base_python = py311
extras = dev
commands = pyright

[testenv:docs]
base_python = py311
extras = dev
commands = mkdocs build --strict
